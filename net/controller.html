<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quizzone!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B0B3A;--cream:#FFF4DC;--stage:#25095E;--gold:#FFC83D;--mag:#FF3DA8;--dimt:#B8ACE0;--pc:#FFC83D}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#12052E;color:var(--cream);overflow:hidden;
 font-family:"Baloo 2","Arial Rounded MT Bold",Arial,sans-serif;font-weight:800;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.d{font-family:"Lilita One","Arial Black",Impact,sans-serif;font-weight:400;letter-spacing:.5px}
#app{position:relative;width:100%;max-width:390px;height:100vh;height:100dvh;max-height:844px;margin:0 auto;background:var(--stage);overflow:hidden}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:16px}
.scr.on{display:flex}
#net{position:absolute;top:0;left:0;right:0;z-index:5;background:var(--mag);color:var(--ink);text-align:center;font-size:15px;padding:4px;display:none}
h1{margin:6px 0 10px;font-size:34px;text-align:center;color:var(--cream);text-shadow:0 3px 0 var(--ink);line-height:1}
.err{min-height:22px;text-align:center;color:var(--gold);font-size:16px;margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pj{position:relative;border:4px solid var(--ink);border-bottom-width:8px;border-radius:20px;background:var(--c);
 color:var(--ink);padding:0;height:104px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden;font:inherit;cursor:pointer}
.pj svg{position:absolute;top:2px;left:50%;width:72px;height:72px;margin-left:-36px}
.pj span{position:relative;font-size:15px;line-height:1;padding-bottom:4px;z-index:1}
.pj.preso{opacity:.35;pointer-events:none}
.pj.sel{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--ink)}
input{width:100%;margin-top:12px;height:50px;border:4px solid var(--ink);border-bottom-width:8px;border-radius:16px;background:var(--cream);
 color:var(--ink);font:inherit;font-size:22px;padding:0 14px;outline:0}
.btn{margin-top:auto;height:64px;border:5px solid var(--ink);border-bottom-width:12px;border-radius:32px;background:var(--gold);color:var(--ink);
 font-size:32px;cursor:pointer;width:100%}
.btn:active{transform:translateY(4px);border-bottom-width:8px}
.hd{margin:-16px -16px 0;padding:34px 16px 14px;background:var(--pc);color:var(--ink);border-bottom:6px solid var(--ink);display:flex;align-items:center;gap:12px}
.hd .av{width:52px;height:52px;flex:none;display:block}
.hd b{display:block;font-size:26px;line-height:1}
.hd small{font-size:15px;opacity:.8}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.big{font-size:44px;line-height:1;text-shadow:0 4px 0 var(--ink)}
.sub{font-size:20px;color:var(--dimt)}
.q{margin:12px 0 10px;background:var(--ink);border:4px solid var(--mag);border-radius:20px;padding:10px 12px;font-size:19px;line-height:1.1;text-align:center}
.tasti{flex:1;display:flex;flex-direction:column;gap:10px}
.k{flex:1;display:flex;align-items:center;gap:12px;background:var(--cream);color:var(--ink);border:5px solid var(--ink);border-bottom-width:12px;
 border-radius:22px;padding:0 14px;font:inherit;font-size:22px;line-height:1.05;text-align:left;cursor:pointer;min-height:0}
.k:active{transform:translateY(4px);border-bottom-width:8px}
.k .f{flex:none;width:46px;height:46px;position:relative}
.k .f svg{width:46px;height:46px;display:block}
.k .f i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--cream);font:normal 400 22px "Lilita One",Impact,sans-serif}
.k.sc{outline:5px solid var(--pc);outline-offset:-1px}
.k:disabled:not(.sc){opacity:.45}
.badge{display:inline-block;padding:2px 22px;border:5px solid var(--ink);border-radius:40px;font-size:40px;color:var(--ink)}
.ok{background:#fff}.ko{background:#5B4A93;color:var(--dimt)}
.tm{margin-left:auto;flex:none;width:60px;height:60px;border-radius:50%;background:var(--ink);border:5px solid var(--gold);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:30px}
.tm.hurry{border-color:var(--mag);color:var(--gold)}
.bb{margin:10px 0 0;text-align:center;background:var(--mag);color:var(--cream);border:4px solid var(--ink);border-radius:24px;font-size:24px;padding:2px 10px;display:none}
.vl{flex:1;display:flex;flex-direction:column;gap:8px;margin-top:10px;overflow:auto}
.v{display:flex;align-items:center;gap:10px;background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-bottom-width:8px;border-radius:18px;padding:0 12px 0 0;font:inherit;font-size:22px;min-height:62px;cursor:pointer;text-align:left;overflow:hidden}
.v:active{transform:translateY(3px);border-bottom-width:5px}
.v .a{flex:none;width:58px;height:58px;background:var(--c);border-right:4px solid var(--ink);position:relative}
.v .a svg{position:absolute;inset:0;width:100%;height:100%}
.v b{flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc{font-size:30px;justify-content:center;gap:14px}
.kc b{font-size:48px;font-weight:400;line-height:1}
.kn{flex:none;width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:26px}
.k.on .kn{background:var(--pc);color:var(--ink)}
.k.on{outline:5px solid var(--pc);outline-offset:-1px}
.crit{margin:10px 0 0;text-align:center;color:var(--gold);font-size:20px;line-height:1.1}
.und{margin-top:10px;height:48px;border:4px solid var(--ink);border-bottom-width:8px;border-radius:24px;background:var(--cream);color:var(--ink);font:inherit;font-size:20px;cursor:pointer}
.torta{margin:auto 0;flex:1;font-size:56px;background:var(--mag);color:var(--cream);text-shadow:0 4px 0 var(--ink)}
.pt{font-size:56px;color:var(--gold);text-shadow:0 4px 0 var(--ink)}
.tasti{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;margin-top:14px}
#cl{display:flex;flex-direction:column}
.k{flex-direction:column;justify-content:center;gap:0;padding:0}
.k .f,.k .f svg{width:110px;height:110px}
.k .f i{font-size:52px}
.k.on{outline:0;opacity:.35}
.kc b{font-size:90px}
.scr.rosso{background:#C4172E}
#s-esito.good{background:#1FA64A}#s-esito.bad{background:#D62839}
@keyframes lampo{0%,50%{filter:brightness(1.9)}25%,75%,100%{filter:none}}
body.lampo{animation:lampo .6s}
</style>
</head>
<body>
<div id="app">
<div id="net" class="d">Connessione persa, riprovo...</div>

<section class="scr" id="s-join">
 <h1 class="d">Scegli il tuo personaggio</h1>
 <div class="err" id="jerr"></div>
 <div class="grid" id="grid"></div>
 <input id="code" maxlength="4" placeholder="CODICE (4 caratteri)" autocapitalize="characters" autocomplete="off" style="display:none;text-transform:uppercase;text-align:center">
 <input id="name" maxlength="12" placeholder="Il tuo nome" autocomplete="off">
 <button class="btn d" id="go">ENTRA!</button>
</section>

<section class="scr" id="s-att">
 <div class="hd"><span class="av"></span><div><b class="d nm"></b><small class="ch"></small></div></div>
 <div class="mid"><div class="big d">📺 Guarda la TV</div></div>
 <button class="und" id="cambia" style="display:none">Cambia personaggio</button>
</section>

<section class="scr" id="s-q">
 <div class="hd"><span class="av"></span><div><b class="d nm"></b></div></div>
 <div class="tasti" id="tasti"></div>
 <div class="sub" id="sent" style="display:none;text-align:center;font-size:16px;margin-top:10px">Risposta inviata · 📺 Guarda la TV</div>
</section>

<section class="scr" id="s-ord">
 <div class="hd"><span class="av"></span><div><b class="d nm"></b></div></div>
 <div class="big d" id="oc" style="text-align:center;margin:14px 0 0;font-size:56px;letter-spacing:6px"></div>
 <div class="tasti" id="otasti"></div>
 <button class="und d" id="oundo">ANNULLA ULTIMA</button>
</section>

<section class="scr" id="s-torta">
 <div class="hd"><span class="av"></span><div><b class="d nm"></b></div></div>
 <button class="btn d torta" id="tbtn">LANCIA! 🥧</button>
</section>

<section class="scr" id="s-ruba">
 <div class="hd"><span class="av"></span><div><b class="d nm"></b></div></div>
 <div class="big d" style="font-size:36px;text-align:center;margin-top:12px">Ruba 300 punti!</div>
 <div class="vl" id="vl"></div>
</section>

<section class="scr" id="s-cat">
 <div class="hd"><span class="av"></span><div><b class="d nm"></b></div></div>
 <div class="tasti" id="cl"></div>
</section>

<section class="scr" id="s-w">
 <div class="hd"><span class="av"></span><div><b class="d nm"></b></div></div>
 <div class="mid"><div class="big d" id="w1"></div></div>
</section>

<section class="scr" id="s-esito">
 <div class="mid"><div class="big d" id="eb" style="font-size:200px;text-shadow:0 8px 0 var(--ink)"></div><div class="sub d" id="etx" style="color:var(--cream);font-size:22px"></div></div>
</section>

<section class="scr" id="s-rej">
 <div class="mid"><div class="big d" id="rmsg" style="font-size:34px"></div></div>
 <button class="btn d" id="rback" style="margin-top:0">INDIETRO</button>
</section>
</div>

   $("vl").innerHTML = (st.vittime||[]).filter(function(v){return v.slot!==me.slot}).map(function(v){
    return '<button class="v" data-s="'+v.slot+'"><span class="a" style="--c:'+esc(v.color||"#fff")+'">'+(SVG[v.avatar]||"")+'</span><b class="d">'+esc(v.name)+'</b><span class="d">'+esc(v.punti)+'</span></button>';
   }).join("");
  } else {
   id = "s-w"; wait("📺 Guarda la TV");
  }
 } else if(f==="categoria"){
  if(st.puo && catr!==st.r){
   id = "s-cat"; call = "c"+st.r;
   $("cl").innerHTML = (st.opzioni||[]).map(function(o,i){
    return '<button class="k kc d" data-i="'+i+'"><b>'+esc(o.icona||"")+'</b></button>';
   }).join("");
  } else {
   id = "s-w"; wait("📺 Guarda la TV");
  }
 } else if(f==="torta"){
  if(st.puo){ id = "s-torta"; call = "t"+st.q }
  else {
   id = "s-w"; wait("📺 Guarda la TV");
  }
 } else if(f==="rivela" && res){
  id = "s-esito"; $("eb").textContent = res.giusta?"✓":"✗"; $("etx").textContent = res.testo||"";
  $("s-esito").className = "scr "+(res.giusta?"good":"bad"); call = "e"+(res.giusta?1:0)+"_"+res.totale;
 } else if(f==="finale"){ id = "s-att";
 } else id = "s-att";
 $("cambia").style.display = (id==="s-att" && f==="lobby" && aperta)?"":"none";
 head($(id)); show(id); tick();
 if(call && call!==lastCall) vib(call.charAt(0)==="e"?(res.giusta?[200]:[150,100,150]):[300,100,300]);
 if(call && call!==lastCall && call.charAt(0)!=="e"){ ding(); lampo() } // tocca a te
 lastCall = call;
}
function tick(){
 if(!st||(st.fase!=="domanda"&&st.fase!=="ruba"&&st.fase!=="categoria"&&st.fase!=="torta")) return;
 var s = Math.max(0, Math.ceil((fine-Date.now())/1000)), l = document.querySelectorAll(".tm");
 for(var i=0;i<l.length;i++){ l[i].textContent = s; l[i].classList.toggle("hurry", s<=5); l[i].style.visibility = st.gioco==="bomba"?"hidden":"" }  // Bomba: miccia nascosta, niente timer
}
setInterval(tick, 200);
$("tasti").onclick = function(e){
 var b = e.target.closest(".k"); if(!b||b.disabled||!st) return;
 var i = +b.dataset.i;
 st.scelta = i; if(navigator.vibrate) navigator.vibrate(50);
 send({t:"answer",q:st.q,choice:i}); render();
};
$("otasti").onclick = function(e){
 var b = e.target.closest(".k"); if(!b||b.disabled||!st||(st.scelta||[]).length===4) return;
 var i = +b.dataset.i; if(oseq.indexOf(i)>=0) return;
 oseq.push(i); if(navigator.vibrate) navigator.vibrate(50);
 if(oseq.length===4){ st.scelta = oseq.slice(); send({t:"order",q:st.q,seq:st.scelta}) }
 render();
};
$("oundo").onclick = function(){ oseq.pop(); render() };
$("tbtn").onclick = function(){
 if(!st||!st.puo) return;
 st.puo = false; if(navigator.vibrate) navigator.vibrate(80);
 send({t:"throw",q:st.q}); render();
};
$("vl").onclick = function(e){
 var b = e.target.closest(".v"); if(!b||!st||rub===st.q) return;
 rub = st.q; if(navigator.vibrate) navigator.vibrate(50);
 send({t:"steal",q:st.q,victim:+b.dataset.s}); render();
};
$("cl").onclick = function(e){
 var b = e.target.closest(".k"); if(!b||!st||catr===st.r) return;
 var i = +b.dataset.i; catr = st.r; catn = ((st.opzioni||[])[i]||{}).nome||""; if(navigator.vibrate) navigator.vibrate(50);
 send({t:"cat",r:st.r,scelta:i}); render();
};
$("go").onclick = function(){
 var c = urlCode || $("code").value.trim().toUpperCase();
 if(!sel){ err = "Scegli un personaggio."; return render() }
 if(!/^[A-Z0-9]{4}$/.test(c)){ err = "Inserisci il codice di 4 caratteri."; return render() }
 err = ""; code = c; ls.set("qz_code", c);
 ls.set("qz_name",$("name").value.trim()); send({t:"join",code:c,name:$("name").value.trim(),avatar:sel,token:ls.get("qz_token")});
};
$("cambia").onclick = function(){
 if(!me||!aperta) return;
 send({t:"leave"}); sel = me.avatar; presi = presi.filter(function(x){return x!==me.avatar});
 $("name").value = me.name; me = null; st = null; render();
};
$("rback").onclick = function(){ rej = ""; render() };

function send(o){ if(ws && ws.readyState===1) ws.send(JSON.stringify(o)) }
function onMsg(m){
 if(!m || typeof m!=="object") return;
 if(m.t==="welcome"){ me = {slot:m.slot,name:m.name,avatar:m.avatar,color:m.color}; ls.set("qz_token",m.token); ls.set("qz_av",m.avatar); err = ""; rej = "" }
 else if(m.t==="lobby"){ presi = m.presi||[]; aperta = !!m.aperta;
  if(need){ need = false; var t = ls.get("qz_token");
   if(t&&code&&!m.aperta) send({t:"join",code:code,name:"",avatar:ls.get("qz_av"),token:t});
   else if(t&&code&&me) send({t:"join",code:code,name:me.name,avatar:me.avatar,token:t}) } }
 else if(m.t==="state"){ if((m.fase==="domanda"||m.fase==="ruba"||m.fase==="categoria"||m.fase==="torta")&&typeof m.tempo==="number") fine = Date.now()+m.tempo*1000; if(m.fase==="domanda"&&(!st||st.q!==m.q)) res = null; st = m }
 else if(m.t==="result"){ res = m }
 else if(m.t==="reject"){
  ls.set("qz_token",""); me = null; var r = REJ[m.reason]||"Non puoi entrare.";
  if(m.reason==="preso"||m.reason==="codice"){ err = r; rej = "" } else rej = r;
 }
 render();
}
function connect(){
 ws = new WebSocket("ws://"+location.hostname+":8081");
 ws.onopen = function(){ $("net").style.display = "none";
  need = true };
 ws.onmessage = function(e){ try{ onMsg(JSON.parse(e.data)) }catch(x){} };
 ws.onclose = function(){ $("net").style.display = "block"; setTimeout(connect, 1000) };
 ws.onerror = function(){ try{ws.close()}catch(x){} };
}

if(demo){
 var D = {name:"Gastone",avatar:"chef",color:"#F2384A",slot:0};

 presi = ["nonna","gatto"]; sel = "chef";

 else if(demo==="attesa"){ me = D; st = {t:"state",fase:"lobby"} }

 else if(demo==="ruba"||demo==="ruba_attesa"){ me = D; fine = Date.now()+8000;
  st = {t:"state",fase:"ruba",q:2,punti:300,tempo:8,puo:demo==="ruba",vittime:[
   {slot:0,name:"Gastone",color:"#F2384A",avatar:"chef",punti:2350},{slot:1,name:"Nonna Pina",color:"#2F7BFF",avatar:"nonna",punti:3100},
   {slot:2,name:"Ugo",color:"#33C759",avatar:"zombi",punti:1800},{slot:3,name:"Brioche",color:"#FFD43B",avatar:"gatto",punti:900}]} }
 else if(demo==="categoria"||demo==="categoria_attesa"){ me = D; fine = Date.now()+8000;
  st = {t:"state",fase:"categoria",r:1,tempo:8,chi:3,chi_nome:"Brioche",puo:demo==="categoria",opzioni:[
   {id:"geo",nome:"Geografia",icona:"🌍"},{id:"cinema",nome:"Cinema e TV",icona:"🎬"},{id:"cucina",nome:"Cucina",icona:"🍝"}]} }
 else if(demo==="ordine"||demo==="ordine_bloccata"){ me = D;
  st = Object.assign({},Q,{gioco:"ordine",domanda:"Metti in ordine",criterio:"Dal più antico al più recente",risposte:["Colosseo","Torre Eiffel","Piramidi di Giza","Statua della Libertà"],scelta:demo==="ordine"?[]:[2,0,3,1]});
  if(demo==="ordine"){ oq = st.q; oseq = [1] } }
 else if(demo==="torta"||demo==="torta_attesa"){ me = D; fine = Date.now()+5000;
  st = {t:"state",fase:"torta",q:2,tempo:5,chi:demo==="torta"?0:3,chi_nome:"Brioche",puo:demo==="torta"} }
 else if(demo==="conto"){ me = D; st = Object.assign({},Q,{gioco:"conto"}) }
 else if(demo==="esito_testo"){ me = D; st = {t:"state",fase:"rivela"}; res = {giusta:true,punti:850,totale:2350,posizione:2,testo:"Hai rubato 300 punti a Ugo!"} }
 else if(demo==="esito"||demo==="esito_ok"){ me = D; st = {t:"state",fase:"rivela"}; res = {giusta:true,punti:850,totale:2350,posizione:2} }
 else if(demo==="esito_ko"){ me = D; st = {t:"state",fase:"rivela"}; res = {giusta:false,punti:-100,totale:2250,posizione:3} }
 else if(demo==="finale"){ me = D; st = {t:"state",fase:"finale"}; res = {giusta:true,punti:500,totale:5200,posizione:1} }
 else if(demo==="reject"){ rej = REJ.pieno }
 render();
} else { $("name").value = ls.get("qz_name"); render(); connect(); }
</script>
